<!doctype html>
<html lang="en">
  <head>
    <!-- Essential Meta Tags -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Reviews & Testimonials | Ali Mohamed</title>

    <!-- Standard SEO Meta Tags -->
    <meta
      name="description"
      content="Authentic reviews, testimonials, and verified 5.0 ratings from clients on Khamsat, international contracts, and WhatsApp communications for Ali Mohamed."
    />
    <meta
      name="keywords"
      content="Ali Mohamed Reviews, Khamsat Reviews, Client Testimonials, Front End Developer, Web Developer Ratings"
    />
    <meta name="author" content="Ali Mohamed" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1f242d" />

    <!-- Open Graph / Facebook / LinkedIn / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://my-portfolio-seven-bice-24.vercel.app/reviews.html" />
    <meta property="og:title" content="Client Reviews & Testimonials | Ali Mohamed" />
    <meta
      property="og:description"
      content="Verified 5-star ratings, testimonials, and video walkthroughs from international clients on Khamsat and WhatsApp."
    />
    <meta property="og:image" content="https://my-portfolio-seven-bice-24.vercel.app/images/og-banner.jpg" />
    <meta property="og:image:secure_url" content="https://my-portfolio-seven-bice-24.vercel.app/images/og-banner.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ali Mohamed - Client Reviews & Testimonials" />
    <meta property="og:site_name" content="Ali Mohamed Portfolio" />
    <meta property="og:locale" content="en_US" />
    <link rel="image_src" href="https://my-portfolio-seven-bice-24.vercel.app/images/og-banner.jpg" />

    <!-- Twitter Card (X) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Client Reviews & Testimonials | Ali Mohamed" />
    <meta
      name="twitter:description"
      content="Verified 5-star ratings, testimonials, and video walkthroughs from international clients on Khamsat and WhatsApp."
    />
    <meta name="twitter:image" content="https://my-portfolio-seven-bice-24.vercel.app/images/og-banner.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="images/ali.jpeg" />
    <link rel="apple-touch-icon" href="images/ali.jpeg" />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body.standalone-reviews {
        background-color: var(--bg-color);
        min-height: 100vh;
        overflow-y: auto;
      }
      .standalone-header {
        position: sticky;
        top: 0;
        left: 0;
        width: 100%;
        padding: 2rem 9%;
        background: rgba(31, 36, 45, 0.95);
        backdrop-filter: blur(10px);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 100;
        border-bottom: 0.1rem solid rgba(255, 255, 255, 0.05);
        visibility: visible;
        opacity: 1;
      }
      .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.8rem;
        padding: 0.8rem 1.8rem;
        background: var(--second-bg-color);
        color: var(--white-color);
        border: 0.15rem solid var(--main-color);
        border-radius: 3rem;
        font-size: 1.5rem;
        font-weight: 500;
        transition: 0.3s;
      }
      .back-btn:hover {
        background: var(--main-color);
        color: var(--bg-color);
        box-shadow: 0 0 1rem var(--main-color);
      }
      .reviews-page-wrapper {
        padding: 4rem 9% 6rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
    </style>
  </head>

  <body class="standalone-reviews">
    <!-- Header -->
    <header class="standalone-header">
      <a href="index.html" class="logo">Ali Mohamed</a>
      <a href="index.html" class="back-btn">
        <i class="bx bx-left-arrow-alt"></i> Back to Portfolio
      </a>
    </header>

    <main class="reviews-page-wrapper">
      <h1 class="heading">Client <span>Reviews</span></h1>

      <div class="reviews-slider-box">
        <div class="reviews-carousel">
          <div class="reviews-slide-track">
            <!-- Slide 1: Abou Malek (Khamsat) -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <img
                  src="images/Reviews/Abou Malek.jpeg"
                  alt="تقييم أبو مالك - خمسات"
                />
              </div>
              <div class="slide-footer">
                <a
                  href="https://khamsat.com/user/ali_mohamed_10/reviews/1114489"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="slide-link"
                >
                  <i class="bx bx-link-external"></i> View on Khamsat
                </a>
              </div>
            </div>

            <!-- Slide 2: Ali B. (Khamsat) -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <img
                  src="images/Reviews/Ali.jpeg"
                  alt="تقييم علي ب. - خمسات"
                />
              </div>
              <div class="slide-footer">
                <a
                  href="https://khamsat.com/user/ali_mohamed_10/reviews/1106276"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="slide-link"
                >
                  <i class="bx bx-link-external"></i> View on Khamsat
                </a>
              </div>
            </div>

            <!-- Slide 3: Suliman (Khamsat) -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <img
                  src="images/Reviews/Suliman.jpeg"
                  alt="تقييم سليمان - خمسات"
                />
              </div>
              <div class="slide-footer">
                <a
                  href="https://khamsat.com/user/ali_mohamed_10/reviews/1102649"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="slide-link"
                >
                  <i class="bx bx-link-external"></i> View on Khamsat
                </a>
              </div>
            </div>

            <!-- Slide 4: Abdelmohsen (Khamsat) -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <img
                  src="images/Reviews/Abdelmohsen.jpeg"
                  alt="تقييم عبدالمحسن - خمسات"
                />
              </div>
              <div class="slide-footer">
                <a
                  href="https://khamsat.com/user/ali_mohamed_10/reviews/1110949"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="slide-link"
                >
                  <i class="bx bx-link-external"></i> View on Khamsat
                </a>
              </div>
            </div>

            <!-- Slide 5: WhatsApp Image 1 (Ayat Elrebeh) -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <img
                  src="images/Reviews/WhatsApp Image 2026-11-20 at 3.15.19 PM.jpeg"
                  alt="رأي العميل عبر واتساب - كندا"
                />
              </div>
              <div class="slide-footer">
                <span class="slide-tag">
                  <i class="bx bxl-whatsapp"></i> Client Feedback on WhatsApp (Canada)
                </span>
              </div>
            </div>

            <!-- Slide 6: WhatsApp Image 2 (Sulaiman) -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <img
                  src="images/Reviews/WhatsApp Image 2026-11-20 at 3.40.49 PM.jpeg"
                  alt="رأي العميل عبر واتساب"
                />
              </div>
              <div class="slide-footer">
                <span class="slide-tag">
                  <i class="bx bxl-whatsapp"></i> Client Feedback on WhatsApp
                </span>
              </div>
            </div>

            <!-- Slide 7: Video 1 -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <video
                  autoplay
                  loop
                  playsinline
                  controls
                  preload="auto"
                  src="images/Reviews/WhatsApp Video 2026-11-20 at 3.40.47 PM.mp4"
                ></video>
              </div>
              <div class="slide-footer">
                <span class="slide-tag">
                  <i class="bx bx-video"></i> Client Review Video #1
                </span>
              </div>
            </div>

            <!-- Slide 8: Video 2 -->
            <div class="review-slide-item">
              <div class="media-wrapper">
                <video
                  autoplay
                  loop
                  playsinline
                  controls
                  preload="auto"
                  src="images/Reviews/WhatsApp Video 2026-11-20 at 3.40.49 PM.mp4"
                ></video>
              </div>
              <div class="slide-footer">
                <span class="slide-tag">
                  <i class="bx bx-video"></i> Client Review Video #2
                </span>
              </div>
            </div>
          </div>
        </div>

        <!-- Slider Controls / Navigation -->
        <div class="reviews-navigation">
          <button class="reviews-arrow-left disabled" aria-label="Previous Review">
            <i class="bx bx-left-arrow-alt"></i>
          </button>
          <div class="reviews-counter">
            <span id="current-slide">1</span> / <span id="total-slides">8</span>
          </div>
          <button class="reviews-arrow-right" aria-label="Next Review">
            <i class="bx bx-right-arrow-alt"></i>
          </button>
        </div>
      </div>
    </main>

    <!-- Image Zoom Lightbox -->
    <div class="image-lightbox" id="image-lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightbox-close" aria-label="Close zoom preview">
        <i class="bx bx-x"></i>
      </button>
      <img src="" alt="Enlarged Review Proof" class="lightbox-img" id="lightbox-img" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
